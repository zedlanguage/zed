[package]
name = "zed-bignum-small"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# zed-bignum's source compiled a second time with the unit tests' small leaves, for zed-kernel's
# unit tests alone, its one dependent (a dev-dependency). The package's name selects the leaves:
# zed-bignum `fast::SMALL_LEAVES`, where a comment says why this is a package and not a feature
# (a feature turned on by a dev-dependency would be on in every test binary of a workspace test
# build). It has no source of its own and runs no tests: zed-bignum's tests cover the same code
# with the same leaves. Its dependencies are zed-bignum's.
[lib]
path = "../zed-bignum/src/lib.rs"
test = false
doctest = false
bench = false

[features]
# Declared so that the source's `cfg(feature = "method-counts")` names a known feature; nothing
# turns it on (Cargo lets no feature of zed-kernel turn on a dev-dependency's feature).
method-counts = []

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
zed-collections.workspace = true
zed-numtheory.workspace = true

[lints]
workspace = true
