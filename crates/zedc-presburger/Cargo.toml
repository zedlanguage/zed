[package]
name = "zedc-presburger"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# A part of the compiler `zedc`, which re-exports its modules at their old paths. Also a dylib, as
# zedc is: an edit recompiles this crate and those above it, and each test binary links one shared
# copy.
[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
imbl.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
zed-kernel.workspace = true
zedc-int.workspace = true
zedc-lattice.workspace = true
zedc-solvers.workspace = true

[lints]
workspace = true

[features]
# The thread-local TWO_AT_A_TIME, which makes and_keeping and or_keeping join as they did before
# Joining, for the tests of the preimage that compare the two (ST-formula-k2). A cfg(test) item
# here would not reach those tests, which are another crate's. Off in a release build.
two-at-a-time = []

# A dylib's file name does not change with its features, so `cargo test -p zedc-presburger` builds
# this crate and zedc-solvers with the features the workspace build gives them, and does not
# overwrite the copies the step tests link to.
[dev-dependencies.zedc-presburger]
path = "."
features = ["two-at-a-time"]

[dev-dependencies.zedc-solvers]
workspace = true
features = ["counts"]
