[package]
name = "zedc"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
# The `zedc` executable, `src/main.rs`, is a target of `zed-native`, which compiles programs
# natively for `zedc build` (step L1.36a) and depends on this package.
autobins = false

# Also a dylib, so that a build with `-C prefer-dynamic` (the local zrun builds) links each test
# binary against one shared copy instead of a static copy per binary.
[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
blake3.workspace = true
imbl.workspace = true
num-bigint.workspace = true
num-integer.workspace = true
num-traits.workspace = true
unicode-ident.workspace = true
unicode-normalization.workspace = true
unicode-script.workspace = true
zed-kernel.workspace = true
zedc-base.workspace = true
zedc-syntax.workspace = true
zedc-int.workspace = true
zedc-lattice.workspace = true
zedc-solvers.workspace = true
zedc-presburger.workspace = true
zedc-types.workspace = true
zedc-resolve.workspace = true
zedc-stage.workspace = true

[dev-dependencies]
# The tests of store::preimage set store::presburger::TWO_AT_A_TIME, which exists only with this
# feature.
zedc-presburger = { workspace = true, features = ["two-at-a-time"] }
# A dylib's file name does not change with its features, so `cargo test -p zedc` builds
# zedc-solvers with the feature `counts` the step tests give it, and does not overwrite their copy.
zedc-solvers = { workspace = true, features = ["counts"] }
rustix.workspace = true
zed-alloc-count.workspace = true
stacker.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
perf-event2.workspace = true

[features]
# Records each type printed on a thread with its text, for the test that parses each back
# (OSP-diag). Off in a release build.
printed-types = ["zedc-types/printed-types"]
# Counts the calls of `Lin2::minus` in `store::live3` on a thread, for the test that bounds the
# work of the linear programs by a count that does not depend on the load (SLABS-count). Off in a
# release build.
counts = ["zedc-solvers/counts"]
# Truncates content addresses so that they collide (step L1.37a); see zed-kernel src/address.rs.
short-addresses = ["zed-kernel/short-addresses"]

[lints]
workspace = true

# The features zed-tests asks for, so that `cargo test -p zedc` builds this dylib as the tests
# link it: its file name does not change with its features, so a build with others would
# overwrite it and the next build of the tests would rebuild it (see crates/zed-native/Cargo.toml).
[dev-dependencies.zedc]
path = "."
features = ["printed-types", "counts"]
