[package]
name = "zedc"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
imbl = "7.0.2"
num-bigint = "0.4"
num-integer = "0.1"
unicode-ident = "1.0.27"
unicode-normalization = "0.1.26"
unicode-script = "0.5.8"
zed-kernel.workspace = true

# Runs the zedc executable itself, which only a test of this package can name.
[[test]]
name = "zedc_binary"
path = "../../tests/steps/m0_09_kernel_evaluator/binary.rs"

[features]
# Records each type printed on a thread with its text, for the test that parses each back
# (OSP-diag). Off in a release build.
printed-types = []

[lints]
workspace = true
