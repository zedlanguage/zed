[package]
name = "zed-tools"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The features zed-tests asks for: zedc is a dylib, whose file name does not change with its
# features, so a build with others would overwrite the one the tests link to (see
# crates/zed-native/Cargo.toml).
zedc = { workspace = true, features = ["printed-types", "counts", "preimage-ref"] }

[lints]
workspace = true
