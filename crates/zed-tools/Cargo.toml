[package]
name = "zed-tools"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The features zed-tests asks for: zedc is a dylib, whose file name does not change with its
# features, so a build with others would overwrite the one the tests link to (see
# crates/zed-native/Cargo.toml).
zedc = { workspace = true, features = ["printed-types", "counts", "preimage-ref"] }

[dev-dependencies]
# zedc-presburger is a dylib too, with the feature `two-at-a-time` that the tests of zedc and its
# crates give it in the workspace build; asked for here, so that `cargo test -p zed-tools` builds
# it as that build does and does not overwrite it.
zedc-presburger = { workspace = true, features = ["two-at-a-time"] }

[lints]
workspace = true
