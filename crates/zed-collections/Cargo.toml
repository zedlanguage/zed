[package]
name = "zed-collections"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# Operations on sorted lists and other small data structures every crate shares, zed-kernel
# included, so it depends on no other crate of the workspace (author P280: "if you need to create
# another crate so that code can be reused, do it"). Also a dylib, as zed-kernel is: each test
# binary links one shared copy.
[lib]
crate-type = ["rlib", "dylib"]

# BigInt, for the binary search of search.rs over integers of any size. zed-numtheory is a dylib
# that holds num-bigint; depending on it makes this dylib link num-bigint from there, where a
# second copy inside this dylib would make every crate that links both fail ("cannot satisfy
# dependencies so `num_bigint` only shows up once"). zed-numtheory depends on no crate of the
# workspace, so this adds no cycle.
[dependencies]
num-bigint.workspace = true
zed-numtheory.workspace = true
# splitmix64, the words of a fixed draw of priority.rs (`ZED_TREAP_SEED`). zed-hash depends on no
# crate.
zed-hash.workspace = true

# Only the tests: the exactness test of the midpoints in search.rs checks them against BigInt.
[dev-dependencies]
num-integer.workspace = true
# The seed of the random tests and the scaling benchmarks of bench.rs (zed_testkit), and the
# meter's `malloc` they measure with (zed-alloc-count's `meter_entry_points!` in src/lib.rs).
# Neither depends on a library crate of the workspace, so these add no cycle.
zed-testkit.workspace = true
zed-alloc-count.workspace = true

[lints]
workspace = true
