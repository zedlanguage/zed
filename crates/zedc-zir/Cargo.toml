[package]
name = "zedc-zir"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# A part of the compiler `zedc`, which re-exports its modules at their old paths. Also a dylib, as
# zedc is: an edit recompiles this crate and those above it, and each test binary links one shared
# copy.
[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
blake3.workspace = true
imbl.workspace = true
num-bigint.workspace = true
zed-kernel.workspace = true
zedc-base.workspace = true
zedc-int.workspace = true
zedc-lattice.workspace = true
zedc-syntax.workspace = true

[lints]
workspace = true
