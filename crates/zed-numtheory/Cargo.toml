[package]
name = "zed-numtheory"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# Number theory every crate shares, zed-kernel included (DRY-number-theory, the author,
# 2026-11-19: one routine per job, in one crate), so it depends on no other crate of the
# workspace. Also a dylib, as zed-kernel is: each test binary links one shared copy.
[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
num-bigint.workspace = true
# The floor division of floorsum.rs (`Integer::div_mod_floor`); the tests check the word gcds
# against its big gcd.
num-integer.workspace = true
num-traits.workspace = true
# SIQS's xorshift64 (siqs.rs) and the fixed streams of bench.rs. zed-hash depends on no crate, so
# this adds no cycle.
zed-hash.workspace = true

[dev-dependencies]
# The seed of the random tests, the fixed streams of examples/timing.rs and the scaling
# benchmarks of bench.rs (zed_testkit), and the meter's `malloc` they measure with
# (zed-alloc-count's `meter_entry_points!`). Neither depends on a library crate of the
# workspace, so these add no cycle.
zed-testkit.workspace = true
zed-alloc-count.workspace = true

[lints]
workspace = true
