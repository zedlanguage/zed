[package]
name = "zed-numtheory"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# Number theory every crate shares, zed-kernel included (DRY-number-theory, the author,
# 2026-11-19: one routine per job, in one crate), so it depends on no other crate of the
# workspace. Also a dylib, as zed-kernel is: each test binary links one shared copy.
[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
num-bigint.workspace = true
num-traits.workspace = true
# SIQS's xorshift64 (siqs.rs), and the generators of tests/src/seed.rs, which the tests and
# examples/timing.rs compile in by `#[path]`. zed-hash depends on no crate, so this adds no cycle.
zed-hash.workspace = true

[dev-dependencies]
# The big gcd the word routines are checked against.
num-integer.workspace = true
# The scaling benchmarks of bench.rs (tests/src/scaling.rs). zed-alloc-count and
# zed-meter-settings depend on no crate of the workspace, so these add no cycle.
rustix.workspace = true
zed-alloc-count.workspace = true
zed-meter-settings.workspace = true
stacker.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
perf-event2.workspace = true

[lints]
workspace = true
