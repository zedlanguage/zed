[package]
name = "zed-alloc-count"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# The workspace forbids `unsafe`; a global allocator is an unsafe trait, implemented once here.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
