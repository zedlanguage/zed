[package]
name = "zed-alloc-count"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2.191"

# The workspace forbids `unsafe`; a global allocator is an unsafe trait, implemented once here,
# with the pthread_create that gives each thread the count of the thread that started it.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
