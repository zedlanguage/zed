[package]
name = "zed-alloc-count"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2.191"

# QueryProcessCycleTime and GetThreadTimes, the counters of work on Windows (see `os`). The crate
# was already in Cargo.lock, by way of other dependencies.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

# The workspace forbids `unsafe`; a global allocator is an unsafe trait, implemented once here,
# with the pthread_create that gives each thread the count of the thread that started it, and the
# calls of the counters of work on macOS and Windows (module `os`).
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
