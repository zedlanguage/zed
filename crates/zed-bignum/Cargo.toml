[package]
name = "zed-bignum"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# Algorithms on BigUint and BigInt every crate shares (DRY-bignum-crate-2026-11-26): fast
# products, division, gcd and printing, product and remainder trees, coprime bases and least
# roots, moved down from zed-kernel. It depends on no crate of the workspace but zed-numtheory
# and zed-collections (for `index::to_u32`), so zed-kernel and zedc-int sit above it. Also a
# dylib, as zed-kernel is: each test binary links one shared copy.
[lib]
crate-type = ["rlib", "dylib"]

[features]
# Counts the calls of `fast::div_rem` and `fast::mul` by method and operand words
# (`fast::method_counts`), for the table at `l01_39_reduced_product::roots::bench`; zed-kernel's
# feature of the same name turns it on. Off in every other build.
method-counts = []

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
zed-collections.workspace = true
zed-numtheory.workspace = true

[dev-dependencies]
# The seed of the random tests and the scaling tests (zed_testkit), the meter's `malloc` they
# measure with (zed-alloc-count's `meter_entry_points!` in src/lib.rs), and the fixed streams of
# coprime.rs's tests (zed-hash). None depends on a library crate of the workspace, so these add
# no cycle.
zed-testkit.workspace = true
zed-alloc-count.workspace = true
zed-hash.workspace = true

[lints]
workspace = true
