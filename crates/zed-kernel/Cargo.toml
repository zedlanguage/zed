[package]
name = "zed-kernel"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Truncates every content address and digest to a few bits, so that distinct values collide
# (step L1.37a; see src/address.rs). Off in a release build.
short-addresses = []

[dependencies]
imbl = "7.0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[dev-dependencies]
rustix.workspace = true
zed-alloc-count.workspace = true
stacker.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
perf-event2.workspace = true
