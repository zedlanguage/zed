[package]
name = "zed-kernel"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Truncates every content address and digest to a few bits, so that distinct values collide
# (step L1.37a; see src/address.rs). Off in a release build.
short-addresses = []
# Counts the calls of `num::fast::div_rem` and `num::fast::mul` by method and operand words
# (`num::fast::method_counts`), for the table at `l01_39_reduced_product::roots::bench`. Off
# in every other build.
method-counts = []

# Also a dylib, so that a build with `-C prefer-dynamic` (the local zrun builds) links each test
# binary against one shared copy instead of a static copy per binary.
[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
imbl = "7.0.2"
hashbrown.workspace = true
foldhash.workspace = true
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
zed-graph.workspace = true
zed-hash.workspace = true
zed-collections.workspace = true
zed-numtheory.workspace = true
# The stack of `treap_set::Iter`, kept inline to a depth of 16 so that walking or comparing a
# small set allocates nothing (`sharing_tied_sets_scales`). The version and `union` are those
# zed-rt names, which the workspace build gives smallvec through cranelift-codegen.
smallvec = { version = "1.16.4", features = ["union"] }

[dev-dependencies]
rustix.workspace = true
zed-alloc-count.workspace = true
zed-meter-settings.workspace = true
# Read by tests/src/scaling.rs (`stacker::remaining_stack`), which src/lib.rs includes in the
# unit tests by `#[path]`; no file under src/ names it.
stacker.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
perf-event2.workspace = true
