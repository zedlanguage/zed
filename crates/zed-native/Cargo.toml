[package]
name = "zed-native"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# The static library is the runtime `zedc build` links into an executable (step L1.36a).
[lib]
crate-type = ["rlib", "staticlib"]

# The `zedc` command. Its source stays with the compiler, in `zedc`, which cannot depend on this
# package; here it can call the native code generator.
[[bin]]
name = "zedc"
path = "../zedc/src/main.rs"
# The library `zedc` is documented at the same path, build/cargo/doc/zedc; documenting this
# target as well makes `cargo doc` warn of an output filename collision (DOC-zedc-collision).
doc = false

# Runs the zedc executable itself, which only a test of this package can name.
[[test]]
name = "zedc_binary"
path = "../../tests/steps/m0_09_kernel_evaluator/binary.rs"

# The executable given command-line arguments (step L1.19a).
[[test]]
name = "command_line_binary"
path = "../../tests/steps/l01_19a_command_line/binary.rs"

# `zedc build` run as a user runs it (step L1.36a).
[[test]]
name = "build_binary"
path = "../../tests/steps/l01_36a_executables/binary.rs"

# `zedc --report` run as a user runs it (TIME-report).
[[test]]
name = "report_binary"
path = "../../tests/steps/l01_30_queries/binary.rs"

# `zedc run --suppress` run from a directory of the user's (DIAG-suppress-rest).
[[test]]
name = "suppress_binary"
path = "../../tests/steps/l01_29_diagnostics/suppress_binary.rs"

[dependencies]
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-jit = "0.137.1"
cranelift-module = "0.137.1"
cranelift-native = "0.137.1"
cranelift-object = "0.137.1"
object.workspace = true
zed-kernel.workspace = true
zed-rt.workspace = true
zedc.workspace = true
# The counters of `zedc --report` (TIME-report), used by the `zedc` executable only: the
# library names neither, so the static library above links neither, and a program `zedc build`
# makes keeps the system allocator.
zed-alloc-count.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
perf-event2.workspace = true

[features]
# A test build: the runtime records the node that allocates each cell, a run that leaves
# cells live names them by type and node, and `counted` gives the runs since it was last
# called and what each left live (OSP-diag). Off in a release build.
counts = ["zed-rt/counts"]

# The workspace forbids `unsafe`; calling JIT-compiled code needs it once, at the entry.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
libc = "0.2.191"
# Strips a copy of zedc in the build_binary test (NATIVE-build-id).
object = { workspace = true, features = ["build"] }
# Sets the stack limit the zedc_binary test's child inherits.
rustix.workspace = true
