[package]
name = "zed-native"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# The static library is the runtime `zedc build` links into an executable (step L1.36a).
[lib]
crate-type = ["rlib", "staticlib"]

# The `zedc` command. Its source stays with the compiler, in `zedc`, which cannot depend on this
# package; here it can call the native code generator.
[[bin]]
name = "zedc"
path = "../zedc/src/main.rs"
# The library `zedc` is documented at the same path, build/cargo/doc/zedc; documenting this
# target as well makes `cargo doc` warn of an output filename collision (DOC-zedc-collision).
doc = false

# Runs the zedc executable itself, which only a test of this package can name.
[[test]]
name = "zedc_binary"
path = "../../tests/steps/m0_09_kernel_evaluator/binary.rs"

# The executable given command-line arguments (step L1.19a).
[[test]]
name = "command_line_binary"
path = "../../tests/steps/l01_19a_command_line/binary.rs"

# The executable given environment variables (step L1.19c).
[[test]]
name = "environment_binary"
path = "../../tests/steps/l01_19c_environment/binary.rs"

# `zedc build` run as a user runs it (step L1.36a).
[[test]]
name = "build_binary"
path = "../../tests/steps/l01_36a_executables/binary.rs"

# The limits `main` sets on its own run, under `zedc run` and an executable (MAIN-limits).
[[test]]
name = "limits_binary"
path = "../../tests/steps/l01_36a_executables/limits_binary.rs"

# What a run writes before it stops, under `zedc run` and an executable, byte for byte
# (EXE-stdout-before-error).
[[test]]
name = "stops_binary"
path = "../../tests/steps/l01_36a_executables/stops_binary.rs"

# The run's own close of standard output and standard error, failed by a seccomp filter, under
# `zedc run` and an executable (PORT-stdout-close-status).
[[test]]
name = "close_binary"
path = "../../tests/steps/l01_36a_executables/close_binary.rs"

# A program doubling a string 62 and 63 times, built and run as a user does
# (BUILD-doubling-60s).
[[test]]
name = "doubling_binary"
path = "../../tests/steps/l01_36a_executables/doubling.rs"

# `zedc --report` run as a user runs it (TIME-report).
[[test]]
name = "report_binary"
path = "../../tests/steps/l01_30_queries/binary.rs"

# `zedc run --suppress` run from a directory of the user's (DIAG-suppress-rest).
[[test]]
name = "suppress_binary"
path = "../../tests/steps/l01_29_diagnostics/suppress_binary.rs"

[[test]]
name = "commands_binary"
path = "../../tests/steps/l01_29_diagnostics/commands_binary.rs"

# Each kind of stop of a run, reached through `zedc run` and an executable (MSG-kinds-e2e-tests).
[[test]]
name = "run_stops_binary"
path = "../../tests/steps/l01_29_diagnostics/run_stops_binary.rs"

# The address of a unit with function types inside its exports' types, written by separate
# `zedc run` processes, alone and in a batch (TEST-param-digest-pinned).
[[test]]
name = "pins_binary"
path = "../../tests/steps/l02_08_import_pinning/pins_binary.rs"

# zedc's output the same under two draws of the treap priorities (PERF-treap-seeded-priorities).
[[test]]
name = "treap_seeds_binary"
path = "../../tests/steps/m0_09_kernel_evaluator/treap_seeds_binary.rs"

[dependencies]
# The key of a link: the content hashes of its object file and runtime library (L1.36b).
blake3 = "1"
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-jit = "0.137.1"
cranelift-module = "0.137.1"
cranelift-native = "0.137.1"
cranelift-object = "0.137.1"
# The DWARF of an executable (DEBUG-dwarf-clif, src/dwarf.rs): the version cranelift-object
# writes `.eh_frame` with, so the lock holds one gimli.
gimli = { version = "0.33.0", default-features = false, features = ["write"] }
object.workspace = true
zed-collections.workspace = true
zed-graph.workspace = true
zed-kernel.workspace = true
zed-rt.workspace = true
zedc.workspace = true
zedc-lattice.workspace = true
# The counters of `zedc --report` (TIME-report), used by the `zedc` executable only: the
# library names neither, so the static library above links neither, and a program `zedc build`
# makes keeps the system allocator.
zed-alloc-count.workspace = true
# SIGPIPE ignored by the executable's start, as Rust's own `main` ignores it (EXE-stdout-before-error).
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
perf-event2.workspace = true

[features]
# A test build: the runtime records the node that allocates each cell, a run that leaves
# cells live names them by type and node, and `counted` gives the runs since it was last
# called and what each left live (OSP-diag). Off in a release build.
counts = ["zed-rt/counts"]

# The workspace forbids `unsafe`; calling JIT-compiled code needs it once, at the entry.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[build-dependencies]
# The hash of the sources in the build of this crate (RUNTIME-build-src, `src/sources.rs`).
blake3 = "1"

[dev-dependencies]
# Strips a copy of zedc in the build_binary test (NATIVE-build-id).
object = { workspace = true, features = ["build"] }
# Sets the stack limit the zedc_binary test's child inherits.
rustix.workspace = true
# zedc and zed-rt are dylibs, whose file names do not change with their features, so every
# package that builds them must ask for the same features as zed-tests, or a build of one
# package overwrites the other's and the next build rebuilds it. Here as dev-dependencies, so
# that `cargo test -p zed-native` matches and the runtime library of a release build stays
# without the test counters.
zedc = { workspace = true, features = ["printed-types", "counts", "preimage-ref", "obligation-test-modes"] }
zed-rt = { workspace = true, features = ["counts"] }
# Likewise this package with the feature `counts` zed-tests gives it, and zedc-presburger with
# `two-at-a-time`, which the tests of zedc and its crates give it in the workspace build.
zed-native = { path = ".", features = ["counts"] }
zedc-presburger = { workspace = true, features = ["two-at-a-time"] }
# And target-lexicon, under cranelift-codegen, with `std`, which cranelift-reader (through
# zed-clif) gives it in the workspace build.
target-lexicon = { version = "0.13.5", features = ["std"] }
# And rustc-hash, under cranelift-codegen, with `std` alone, as zed-clif, zed-tests and
# zed-benches give it: rustc-hash 2.1.3 defines default = ["std"], so the two sets build the
# same code, but run_tests.sh and merge_check.sh compare the names. This line gave it its
# default features until TEST-dry-shared-units, after cdaf3d962 had taken them off zed-clif's,
# so the workspace build got [default,std] from here and zed-clif alone [std], and merge_check
# refused every branch that changed a manifest.
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
# And log, under cranelift-codegen, with `alloc` and `std`, which loom's tracing-subscriber
# (zed-rt's tests, TEST-rt-weakmem) gives it in the workspace build; without this line this
# package alone got log [ ] and merge_check step 0a refused the branch. zed-clif, zed-tests and
# zed-benches carry the same line.
log = { version = "0.4.34", features = ["alloc", "std"] }
