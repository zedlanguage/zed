[package]
name = "zed-graph"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# Graph algorithms every crate shares, zed-kernel included, so it depends on no other crate of
# the workspace. Also a dylib, as zed-kernel is: each test binary links one shared copy.
[lib]
crate-type = ["rlib", "dylib"]

[dev-dependencies]
# The fixed xorshift64 streams of some tests (`zed_hash::Xorshift64`); the seed of a random test
# and the scaling test of the rule of low complexity (zed_testkit); and the meter's `malloc` it
# measures with (zed-alloc-count's `meter_entry_points!`). None depends on a library crate of
# the workspace, so these add no cycle.
zed-hash.workspace = true
zed-testkit.workspace = true
zed-alloc-count.workspace = true

[lints]
workspace = true
