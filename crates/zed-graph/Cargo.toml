[package]
name = "zed-graph"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# Graph algorithms every crate shares, zed-kernel included, so it depends on no other crate of
# the workspace. Also a dylib, as zed-kernel is: each test binary links one shared copy.
[lib]
crate-type = ["rlib", "dylib"]

[dev-dependencies]
# The generators of tests/src/seed.rs, which the tests compile in by `#[path]`. zed-hash depends
# on no crate, so this adds no cycle.
zed-hash.workspace = true
rustix.workspace = true
zed-alloc-count.workspace = true
zed-meter-settings.workspace = true
stacker.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
perf-event2.workspace = true

[lints]
workspace = true
