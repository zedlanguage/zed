[package]
name = "zedc-affine"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# A part of the compiler `zedc`: the integer affine forms `Σ c·x + k` its constraint solvers share.
# Also a dylib, as zedc is: an edit recompiles this crate and those above it, and each test binary
# links one shared copy.
[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
# The persistent maps of `hull`.
imbl.workspace = true
# The treap and its priorities of `hull`'s rows; zed-collections depends on zed-numtheory and
# zed-hash alone, so this adds no cycle.
zed-collections.workspace = true
# The work list of `equalities`; zed-graph depends on no crate, so this adds no cycle.
zed-graph.workspace = true
zed-numtheory.workspace = true
zedc-int.workspace = true

[dev-dependencies]
# The seed and generator of a random test (zed_testkit::seed).
zed-testkit.workspace = true

[lints]
workspace = true
