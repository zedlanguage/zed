[package]
name = "zed-rt"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

# The workspace forbids `unsafe`; mapping the stack a run uses and switching to it need it, in
# `stack.rs` only.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Also a dylib, so that a build with `-C prefer-dynamic` (the local zrun builds) links each test
# binary against one shared copy instead of a static copy per binary.
[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
libc = "0.2.191"
psm = "0.1.32"
zed-kernel.workspace = true

[features]
# A test build: each cell records the node that allocated it, and `Heap::survivors` lists the
# cells still live by type and by that node (OSP-diag). Off in a release build, where
# `Heap::allocating` is empty.
counts = []

# The features zed-tests asks for, so that `cargo test -p zed-rt` builds this dylib as the tests
# link it: its file name does not change with its features, so a build with others would
# overwrite it and the next build of the tests would rebuild it (see crates/zed-native/Cargo.toml).
[dev-dependencies.zed-rt]
path = "."
features = ["counts"]

# The shared scaling checks (tests/src/scaling.rs) of the benchmarks in `stack/bench.rs`: they
# count instructions with perf-event2 and bytes with zed-alloc-count, read clocks with rustix
# and the room left on the stack with stacker.
[dev-dependencies]
rustix.workspace = true
stacker.workspace = true
zed-alloc-count.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
perf-event2.workspace = true
