# Every test on every commit (DESIGN.md step M0.1). CI=true makes insta fail on a
# snapshot mismatch instead of writing a pending one.
name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The corpus outputs against their Python reference scripts (step M0.4).
      - run: sh zed/corpus/refcheck.sh

  # Line coverage of the compiler crates, printed in the job log. No threshold yet: the plan
  # asks for near-full coverage, judged per step from this report.
  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --summary-only --show-missing-lines
