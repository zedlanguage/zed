# The local test suite on every commit (DESIGN.md step M0.1); it needs only the Rust toolchain.
# Clippy also compiles the full battery, which runs locally with tools/run_tests.sh --full,
# so that it cannot stop building unnoticed. CI=true makes insta fail on a
# snapshot mismatch instead of writing a pending one. No test reads the spec repository: the
# grammar and fixtures are this repository's own, which the hand-run `sync` tool refreshes.
name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features zed-tests/full -- -D warnings
      # Scaling tests read a perf_event counter: instructions, or the task clock on a VM with no
      # hardware counter. A test stops with an error if neither opens.
      - run: sudo sysctl kernel.perf_event_paranoid=1
      - run: cargo test --workspace

  # Line coverage of the compiler crates, printed in the job log. No threshold yet: the plan
  # asks for near-full coverage, judged per step from this report.
  coverage:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: sudo sysctl kernel.perf_event_paranoid=1
      - run: cargo llvm-cov --workspace --summary-only --show-missing-lines
