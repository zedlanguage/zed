# The Rust toolchain this workspace builds and tests with (BUILD-root-toolchain-pin,
# BUILD-parallel-frontend): one dated nightly, installed by rustup, which reads this file in this
# directory and every directory below it. A nightly because its compiler runs the front end on
# several threads (`-Zunstable-options --jobs-frontend=N` in .cargo/config.toml and zrun), which
# no stable release does yet (author P389, P393, P395). Agent builds use 1 thread (P399); 8 only
# for a whole-suite clean build by the author's order (timings in .cargo/config.toml). Dated, so that every machine builds with
# the same compiler: `rustc 1.102.0-nightly (59cbdee2e 2026-11-17)`, from the dist date
# 2026-11-18. tools/fetch_test_deps.sh fetches the same build for the cross builds and the test
# image, and the full piece s09_release checks all three agree. A new pin: change the date here
# and in fetch_test_deps.sh (with the hashes from that date's channel-rust-nightly.toml), run
# `rustup toolchain install` in the root and fetch_test_deps.sh again. Without rustup, use a
# rustc of this exact build on the PATH; a stable rustc refuses the -Z flag. llvm-tools gives the
# llvm-profdata and llvm-cov of the compiler's own LLVM, which `tools/run_tests.sh --cov` needs:
# the system's (LLVM 22) cannot read the raw profiles this LLVM (23) writes.
[toolchain]
channel = "nightly-2026-11-18"
components = ["clippy", "rustfmt", "llvm-tools"]
profile = "minimal"
