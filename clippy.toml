# A type's order and equality read only its parts and node ids, never the lazily filled
# body of a recursive node (zed-kernel src/types.rs). A string's order and equality read its
# text, which the lazily written-out copy of a join does not change (src/text.rs). A kept
# root's order and equality read its radicand and index, never the approximation kept beside
# it (zedc-int src/int.rs, `Memo`). A signature's hash and equality never read the facts of
# its variables it fills on first use (zedc-types src/ty.rs, `Facts`). A row's hash and
# equality read its digest and components, never the keys of its components it fills on first
# use (zedc-types src/ty.rs, `Row::keys`), and so do a payload shape's (`Shape`'s `Placed::keys`).
# A formula's equality and hash read its parts and the hash a shared part keeps of the node
# that holds it, which the parts alone fix and which is filled once (zedc-presburger
# src/presburger/formula.rs, `Shared`); a part whose parts change loses it.
# A member list's hash and equality read its length, digest and members, never the set of
# its members it fills on first use (zedc-types src/ty.rs, `Members`).
# A range's hash, order and equality read its entries, which its two ends fix, and the map of
# them it fills on first walk holds the same entries (zed-kernel src/value.rs, `Span`).
# A list joined by `++` is the same: its hash, order and equality read its entries, which its
# parts fix, and the map of them it fills on first walk holds the same entries (zed-kernel
# src/value.rs, `Chain`), and the sum of its entries a part keeps once a hash reads it is fixed
# by those entries too.
# A map's hash, order and equality read its entries, never the sums of the entries beneath its
# branches that a family's hash keeps (zed-kernel src/btree.rs, `Map::sum`), which the entries
# fix and which a change clears on its path.
# A kernel subterm's equality reads its id and its term, never the names the term reads, which
# the evaluator fills on first use (zed-kernel src/term.rs, `ReadsMemo`): the memo is private to
# zed-kernel, read only through `Shared::reads_memo` by src/eval/made.rs, and no `Hash` or `Ord`
# is implemented for `Shared` or `Term`. So the order of a written constraint's address
# (zedc-preimage src/address.rs, `Address`), which reads its digest, node ids and canonical
# term, never reads it either. `Address` is listed rather than the memo, so that any other key
# type that holds a subterm is refused until its order is shown not to read the memo (tests
# `address::tests::a_run_of_the_canonical_term_does_not_change_the_address` and
# `eval::tests::the_names_a_body_reads_take_no_part_in_equality`).
# A pointer memo's key hashes and compares the address of the `Arc` it holds and nothing else
# (zed-collections src/by_address.rs, `ByAddress`): no change inside the value can move its
# hash or equality, whatever the value holds.
ignore-interior-mutability = [
  "zed_kernel::types::Type",
  "zed_kernel::text::Text",
  "zed_kernel::value::Span",
  "zed_kernel::value::chain::Chain",
  "zed_kernel::btree::Map",
  "zedc_int::int::Memo",
  "zedc_types::ty::Facts",
  "zedc_types::ty::Members",
  "zedc_types::ty::Row",
  "zedc_types::ty::Shape",
  "zedc_presburger::presburger::formula::Shared",
  "zedc_preimage::address::Address",
  "zed_collections::by_address::ByAddress",
]
