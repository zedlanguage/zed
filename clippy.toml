# A type's order and equality read only its parts and node ids, never the lazily filled
# body of a recursive node (zed-kernel src/types.rs). A string's order and equality read its
# text, which the lazily written-out copy of a join does not change (src/text.rs).
ignore-interior-mutability = ["zed_kernel::types::Type", "zed_kernel::text::Text"]
