# A type's order and equality read only its parts and node ids, never the lazily filled
# body of a recursive node (zed-kernel src/types.rs). A string's order and equality read its
# text, which the lazily written-out copy of a join does not change (src/text.rs). A kept
# root's order and equality read its radicand and index, never the approximation kept beside
# it (zedc-int src/int.rs, `Memo`). A signature's hash and equality never read the facts of
# its variables it fills on first use (zedc-types src/ty.rs, `Facts`). A row's hash and
# equality read its digest and components, never the keys of its components it fills on first
# use (zedc-types src/ty.rs, `Row::keys`), and so do a payload shape's (`Shape`'s `Placed::keys`).
ignore-interior-mutability = [
  "zed_kernel::types::Type",
  "zed_kernel::text::Text",
  "zedc_int::int::Memo",
  "zedc_types::ty::Facts",
  "zedc_types::ty::Row",
  "zedc_types::ty::Shape",
]
