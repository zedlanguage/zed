# The tests that need tools outside the Rust toolchain; tools/run_tests.sh --full runs them.
[[test]]
name = "full"
path = "full/main.rs"
required-features = ["full"]

# These two take many gigabytes, so tools/run_tests.sh gives each of their tests a piece of its own.
[[test]]
name = "deep_values"
path = "steps/m0_09_kernel_evaluator/deep_values.rs"

[[test]]
name = "deep_scaling"
path = "steps/m0_09_kernel_evaluator/deep_scaling.rs"

# Its own binary, so the default stack of a test thread is what it runs on, and its deep tests
# do not lengthen the piece of step L1.36.
[[test]]
name = "deep_heap"
path = "steps/l01_36_cranelift/deep_heap.rs"

# Its own binary, so the default stack of a test thread is what its deep types run on.
[[test]]
name = "deep_types"
path = "steps/l01_22_type_representation/deep_types.rs"

# Its own binary, so its deep searches do not lengthen the piece of step L1.23.
[[test]]
name = "deep_search"
path = "steps/l01_23_subtyping/deep_search.rs"

[features]
full = []
# The build whose content addresses collide, for the tests of step L1.37a.
short-addresses = ["zedc/short-addresses", "zed-kernel/short-addresses"]

[dependencies]
insta.workspace = true
zedc = { workspace = true, features = ["printed-types", "counts", "preimage-ref"] }
zed-corpus-ref.workspace = true
zed-tools.workspace = true
zed-alloc-count.workspace = true
zed-kernel.workspace = true
zed-native = { workspace = true, features = ["counts"] }
zed-rt = { workspace = true, features = ["counts"] }
stacker.workspace = true
unicode-ident.workspace = true
unicode-normalization = "0.1.26"
num-bigint = "0.4.8"
num-integer = "0.1"
num-traits = "0.2"
blake3 = "1"
# Writes the object files of the scaling test of zed_native::link::runtime_of.
object = { workspace = true, features = ["write"] }

# The scaling tests read perf_event_open on Linux; macOS and Windows have their own counters, in
# zed-alloc-count (see tests/src/scaling.rs).
[target.'cfg(target_os = "linux")'.dependencies]
perf-event2.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# What the tests of the other packages ask for in the workspace build, so that
# `cargo test -p zed-tests --lib` builds every library as that build does: zedc-presburger is a
# dylib, whose file name does not change with its features, and a build with others would
# overwrite the one every test binary loads; object as zed-native's tests have it.
[dev-dependencies]
zedc-presburger = { workspace = true, features = ["two-at-a-time"] }
object = { workspace = true, features = ["build"] }

[lints]
workspace = true
