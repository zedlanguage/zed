[package]
name = "zed-tests"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# One test binary for every step folder, so that adding a step adds a module, not a link.
[[test]]
name = "steps"
path = "steps/main.rs"

# The tests that need tools outside the Rust toolchain; tools/run_tests.sh --full runs them.
[[test]]
name = "full"
path = "full/main.rs"
required-features = ["full"]

# These two take many gigabytes or time what they run, so each needs a piece of its own.
[[test]]
name = "deep_values"
path = "steps/m0_09_kernel_evaluator/deep_values.rs"

[[test]]
name = "deep_scaling"
path = "steps/m0_09_kernel_evaluator/deep_scaling.rs"

[features]
full = []

[dependencies]
insta.workspace = true
zedc.workspace = true
zed-kernel.workspace = true
zed-native.workspace = true
zed-rt.workspace = true
unicode-normalization = "0.1.26"

[lints]
workspace = true
