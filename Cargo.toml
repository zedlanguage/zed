[workspace]
resolver = "3"
members = [
    "crates/zedc",
    "crates/zedc-base",
    "crates/zedc-syntax",
    "crates/zedc-int",
    "crates/zedc-lattice",
    "crates/zedc-solvers",
    "crates/zedc-presburger",
    "crates/zedc-types",
    "crates/zedc-resolve",
    "crates/zedc-stage",
    "crates/zedc-preimage",
    "crates/zedc-check",
    "crates/zedc-zir",
    "crates/zedc-elab",
    "crates/zed-kernel",
    "crates/zed-rt",
    "crates/zed-cert",
    "crates/zed-native",
    "crates/zed-tools",
    "crates/zed-alloc-count",
    "zed/corpus/ref",
    "tests",
    "benches",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/zedlanguage/zed"
publish = false

[workspace.dependencies]
zed-kernel = { path = "crates/zed-kernel" }
zed-rt = { path = "crates/zed-rt" }
zed-cert = { path = "crates/zed-cert" }
zedc = { path = "crates/zedc" }
zed-native = { path = "crates/zed-native" }
zed-corpus-ref = { path = "zed/corpus/ref" }
zed-tools = { path = "crates/zed-tools" }
zed-alloc-count = { path = "crates/zed-alloc-count" }
zedc-base = { path = "crates/zedc-base" }
zedc-syntax = { path = "crates/zedc-syntax" }
zedc-int = { path = "crates/zedc-int" }
zedc-lattice = { path = "crates/zedc-lattice" }
zedc-solvers = { path = "crates/zedc-solvers" }
zedc-presburger = { path = "crates/zedc-presburger" }
zedc-types = { path = "crates/zedc-types" }
zedc-resolve = { path = "crates/zedc-resolve" }
zedc-stage = { path = "crates/zedc-stage" }
zedc-preimage = { path = "crates/zedc-preimage" }
zedc-check = { path = "crates/zedc-check" }
zedc-zir = { path = "crates/zedc-zir" }
zedc-elab = { path = "crates/zedc-elab" }
# The libraries the compiler crates (zedc, zedc-*) share, at one version each.
blake3 = "1"
imbl = "7.0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rustc-hash = "2.1.3"
any_ascii = "0.3.3"
unicode-ident = "1.0.27"
unicode-normalization = "0.1.26"
unicode-script = "0.5.9"
unicode-security = "0.1.3"
unicode-width = "0.2.3"
insta = "1.49.0"
# "fs" is zedc's (zedc::unit::Place::of). Every package asks for it, so that `cargo test -p <one>`
# of a crate that reaches rustix only through its tests builds rustix as the workspace build does
# and reuses that build (tools/run_tests.sh builds a selected crate's tests that way).
rustix = { version = "1.1.6", features = ["time", "process", "fs"] }
perf-event2 = "0.7.4"
stacker = "0.1.25"
# Reads symbol tables: which runtime library a build of zed-native made (zed_native::link).
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "archive", "std"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The step tests run programs of up to 10^7 evaluation steps and scaling tests at large sizes, so
# every crate is optimized in test builds; overflow checks and debug assertions stay on.
# Debug info is off: it takes 69% of the build directory and a third of the build time.
[profile.dev]
opt-level = 2
debug = false
# No ThinLTO across a crate's codegen units (BUILD-incr-stale). With it, rustc rewrites the previous
# incremental session's thin-lto-past-keys.bin in place through a hard link; a build killed after
# that (a timeout, a SIGKILL) leaves new keys beside old objects, and every later build reuses an
# object naming a `.llvm.<hash>` symbol no longer defined: "undefined hidden symbol" at link.
# Turning it off also made a one-line zed-kernel rebuild faster and tests no slower (measured).
lto = "off"

# num-bigint as one codegen unit (L01_24-decimal-scale, COMPLEXITY.md K81). Without ThinLTO its
# loops call small iterator functions placed in other units (`Zip::new` in `add2` and `sub2`), which
# then are not inlined: writing 160,000 digits took 16.7% more instructions and 20,000 digits 10.6%
# more, and `l01_24 writing_a_long_decimal_end_scales` went from 23.5 to 24.8 times (limit 24).
# One unit inlines them as ThinLTO did: 7.86 M and 185.5 M instructions, 23.6 times. num-bigint is
# not built incrementally, so this has no thin-lto-past-keys.bin.
[profile.dev.package.num-bigint]
codegen-units = 1

# For perf and gdb only: cargo test --profile profiling. Delete build/cargo/profiling afterward.
[profile.profiling]
inherits = "dev"
debug = true
# Dependencies as one codegen unit each, in place of part of the inlining ThinLTO gave
# (PA-lto-cost). Without ThinLTO a function in one unit is not inlined into another. With
# lto = "off" there is no ThinLTO pass at all, so no thin-lto-past-keys.bin is written whatever the
# number of units. Instructions of l01_39 `product::arms` (block of 4000 / fees of 1000 / bound
# block of 4000), least of three runs:
#   lto = false (ThinLTO, as before 377e39a9)           623 M /   900 M / 815 M
#   lto = "off", default units (377e39a9)                757 M / 1,077 M / 989 M
#   these settings                                       719 M / 1,016 M / 944 M
#   these, and zedc-preimage as 4 units                  700 M /   974 M / 906 M
#   these, and zedc-preimage as 1 unit                   672 M /   921 M / 864 M
# Dependencies are rarely rebuilt, so their one unit costs nothing on an edit. Most of what is left
# is in zedc-preimage, which calls the instances of imbl and imbl-sized-chunks generics it uses
# (`Chunk::as_slice`, `Chunk::clone`, `Node::lookup`) in other units. Fewer units there would inline
# them, but a one-line zedc-preimage edit then rebuilt the l01_39 test in 23 to 30 s with 4 units,
# 34 s with 2 and 64 s with 1, against 11 to 14 s with the default. zed-alloc-count, a workspace
# member that is almost never edited, also takes one unit: its counting allocator runs on every
# allocation.
[profile.dev.package."*"]
codegen-units = 1

[profile.dev.package.zed-alloc-count]
codegen-units = 1
